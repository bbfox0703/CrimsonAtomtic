# Windows release workflow for the CrimsonAtomtic save editor.
#
# Builds the self-contained Native-AOT single-file exe (crimson_rs.lib folded
# in, no .NET runtime needed), runs the tests, packages dist/ into a .zip +
# sha256, and attaches it to a DRAFT GitHub Release. docs/release-process.md
# is the runbook; this file is what CI runs.
#
# Trigger: a pushed `v*` tag (tag shape: v<major>.<minor 2 digits>.<patch 2
# digits>, e.g. v2.06.02). workflow_dispatch builds the artifact only, even
# when started on a tag ref: every release step also requires a push event.
#
# Inputs are pinned, as in ci.yml: actions by SHA, SDK by global.json, Rust by
# RUST_TOOLCHAIN, crimson-rs by vendor/crimson-rs.ref, NuGet by the lock files
# (locked mode), crate dependencies by Cargo.lock. The build job's token is
# read-only; only the release job can write, and it runs no build code.
#
# Release notes: the release job prepends the ANNOTATED tag's message verbatim
# (write it in English and 繁體中文) to an English changelog of the previous-tag
# → this-tag commits, grouped by conventional-commit type. A lightweight tag
# has no message, so only the changelog is produced (CI logs a warning).
name: Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # build + artifact only

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.100.1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build + test + package (AOT)
    # windows-2025-vs2026 ships MSVC, which the crimson_rs.lib staticlib and
    # the AOT linker both need.
    runs-on: windows-2025-vs2026
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Vendor crimson-rs at vendor/crimson-rs.ref
        shell: pwsh
        run: ./scripts/checkout_crimson_rs.ps1

      - name: Toolchain versions
        shell: pwsh
        run: |
          dotnet --version
          cargo --version
          rustc --version

      - name: Check the tag against the version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        # vX.YY.ZZ must name the csproj's VerMajor / VerMinor / VerPatch. A
        # pure-numeric vNNN instead pins build_number.txt, and must fit the
        # 16 bits Windows gives each version part.
        run: |
          $tag = $env:GITHUB_REF_NAME
          $csproj = Get-Content src/CrimsonAtomtic.Ui/CrimsonAtomtic.Ui.csproj -Raw
          function Get-Ver([string]$name) {
            if ($csproj -notmatch "<$name>(\d+)</$name>") { throw "$name not found in the Ui csproj" }
            [int]$Matches[1]
          }
          if ($tag -match '^v(\d+)$') {
            $n = [long]$Matches[1]
            if ($n -gt 65535) { throw "Tag $tag would set the build number to $n; the largest a version part can hold is 65535." }
            [System.IO.File]::WriteAllText("$PWD/build_number.txt", "$n`n")
            Write-Host "Pinned build_number.txt = $n (from tag $tag)"
          } elseif ($tag -match '^v(\d+)\.(\d+)\.(\d+)') {
            $want = "{0}.{1}.{2}" -f [int]$Matches[1], [int]$Matches[2], [int]$Matches[3]
            $have = "{0}.{1}.{2}" -f (Get-Ver VerMajor), (Get-Ver VerMinor), (Get-Ver VerPatch)
            if ($want -ne $have) { throw "Tag $tag names $want but the Ui csproj is $have." }
          } else {
            throw "Tag $tag is neither vX.YY.ZZ nor vNNN."
          }

      - name: Build the native core
        shell: pwsh
        run: ./scripts/build_rust.ps1

      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project src/CrimsonAtomtic.Tests/CrimsonAtomtic.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "tests failed (exit $LASTEXITCODE)" }

      - name: Build + publish single-file AOT (win-x64)
        shell: pwsh
        # Throws on a single-file regression (crimson_rs.dll shipped or
        # imported, exe missing); dumpbin is found through vswhere.
        run: ./scripts/package_aot.ps1 -Runtime win-x64 -SkipRustBuild

      - name: Package dist into a zip + sha256
        id: package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'manual' }
          $zip = "CrimsonAtomtic-$tag-win-x64.zip"
          if (-not (Test-Path 'dist/win-x64')) { throw 'dist/win-x64 not found — build failed?' }
          Compress-Archive -Path dist/win-x64/* -DestinationPath $zip -Force
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packaged $zip (sha256 $h)"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CrimsonAtomtic-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

  release:
    name: Create DRAFT GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history + tags: the notes need the previous tag and the
          # annotated tag's message, which a shallow checkout lacks.
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CrimsonAtomtic-windows-x64

      - name: Create DRAFT GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY

          # ── Previous release tag ────────────────────────────────────────
          # Nearest tag reachable from this tag's parent commit. Empty on the
          # very first tagged release (git describe exits non-zero -> no range).
          $prev = (& git describe --tags --abbrev=0 "$tag^" 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $prev) { $prev = '' } else { $prev = $prev.Trim() }
          $range = if ($prev) { "$prev..$tag" } else { $tag }

          # ── Auto English changelog from the commit range ────────────────
          # Grouped by conventional-commit type; merge commits skipped so the
          # PR-merge noise drops and the underlying feat/fix commits show.
          $feat  = [System.Collections.Generic.List[string]]::new()
          $fix   = [System.Collections.Generic.List[string]]::new()
          $other = [System.Collections.Generic.List[string]]::new()
          foreach ($l in (& git log $range --no-merges --pretty=format:'%h %s')) {
            if (-not $l) { continue }
            $sp = $l -split ' ', 2
            $subj = if ($sp.Count -gt 1) { $sp[1] } else { '' }
            $entry = "* $subj ($($sp[0]))"
            if     ($subj -match '^feat([(!:])') { $feat.Add($entry) }
            elseif ($subj -match '^fix([(!:])')  { $fix.Add($entry) }
            else                                  { $other.Add($entry) }
          }

          $md = [System.Text.StringBuilder]::new()

          # ── Curated bilingual highlights from the ANNOTATED tag message ──
          # You write these at `git tag -a <tag>` time (English + 繁體中文),
          # so each release carries its own notes — no stale committed file.
          # Lightweight tags have no annotation; the section is then omitted.
          if ((& git cat-file -t $tag) -eq 'tag') {
            # git emits the annotation as multiple lines; PowerShell captures that
            # as a string[]. Join with newlines so the markdown bullets/headers keep
            # their line breaks (without the join they'd be space-collapsed into one
            # paragraph by the array->string coercion in AppendLine).
            $ann = ((& git tag -l --format='%(contents)' $tag) -join "`n").TrimEnd()
            if ($ann) { [void]$md.AppendLine($ann); [void]$md.AppendLine() }
          } else {
            Write-Host "::warning::$tag is a lightweight tag — no annotated message, so the bilingual highlights are omitted. Use 'git tag -a' to include them."
          }

          # ── Auto changelog body ─────────────────────────────────────────
          [void]$md.AppendLine('## What''s changed')
          [void]$md.AppendLine($(if ($prev) { "**$prev → $tag**" } else { '**Initial release**' }))
          [void]$md.AppendLine()
          if ($feat.Count)  { [void]$md.AppendLine('### Features');  $feat  | ForEach-Object { [void]$md.AppendLine($_) }; [void]$md.AppendLine() }
          if ($fix.Count)   { [void]$md.AppendLine('### Fixes');     $fix   | ForEach-Object { [void]$md.AppendLine($_) }; [void]$md.AppendLine() }
          if ($other.Count) { [void]$md.AppendLine('### Other');     $other | ForEach-Object { [void]$md.AppendLine($_) }; [void]$md.AppendLine() }
          if ($prev) { [void]$md.AppendLine("**Full changelog:** https://github.com/$repo/compare/$prev...$tag"); [void]$md.AppendLine() }

          # ── Standing footer (boilerplate; bilingual highlights go in the tag) ──
          [void]$md.AppendLine('---')
          [void]$md.AppendLine('Self-contained Windows x64 build — no .NET runtime install required. Unzip and run CrimsonAtomtic.exe.')
          [void]$md.AppendLine()
          [void]$md.AppendLine('- In-place edits (item counts, states, gate/flag toggles) are safe on every save.')
          [void]$md.AppendLine('- Length-changing edits (completing challenges, adding/removing list items) are written correctly but can trip a latent bug in the game''s own save loader on some heavily-progressed saves; the editor warns before saving such an edit and always keeps a backup.')
          [void]$md.AppendLine()
          $crimsonRs = (Get-Content vendor/crimson-rs.ref -Raw).Trim()
          [void]$md.AppendLine("Built against crimson-rs [$($crimsonRs.Substring(0, 7))](https://github.com/bbfox0703/crimson-rs/commit/$crimsonRs).")
          [void]$md.AppendLine()
          [void]$md.AppendLine('> The exe is unsigned — Windows SmartScreen / antivirus may warn on first run. Verify the download with the included .sha256.')

          Set-Content -Path release-notes.md -Value $md.ToString() -Encoding utf8
          Write-Host "Generated release notes ($tag; previous tag: $(if ($prev) { $prev } else { '(none — first release)' }))"
          # Upsert: works whether the tag was pushed via `git push` (no release
          # yet -> create a DRAFT) or created in the web UI (release exists ->
          # just attach the assets).
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$env:ZIP" "$env:ZIP.sha256" --clobber
            Write-Host "Release $tag already existed — uploaded assets to it."
          } else {
            gh release create $tag "$env:ZIP" "$env:ZIP.sha256" `
              --draft `
              --title "CrimsonAtomtic $tag" `
              --notes-file release-notes.md
            Write-Host "Created DRAFT release $tag — review the assets, then Publish."
          }
